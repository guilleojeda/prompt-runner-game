name: Checks and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verify build and infrastructure
    runs-on: ubuntu-24.04
    env:
      BUILD_REVISION: ${{ github.sha }}
      VITE_BUILD_REVISION: ${{ github.sha }}
      MONITORING_BASIC_AUTH_SHA256: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MONITORING_BASIC_AUTH_SHA256 || '' }}
      MONITORING_API_KEY_SHA256: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && secrets.MONITORING_API_KEY_SHA256 || '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            export MONITORING_BASIC_AUTH_SHA256=a8b72980f5f7bd9fa1ac542c5608252885ff846c0bfdda2e07750608c55ac64f
            export MONITORING_API_KEY_SHA256=b7c9d143f3da3e38793d79c2088ae9fb58e5ce752d8b7c4ca1c432d4fa6e0b79
            echo "MONITORING_BASIC_AUTH_SHA256=a8b72980f5f7bd9fa1ac542c5608252885ff846c0bfdda2e07750608c55ac64f" >> "$GITHUB_ENV"
            echo "MONITORING_API_KEY_SHA256=b7c9d143f3da3e38793d79c2088ae9fb58e5ce752d8b7c4ca1c432d4fa6e0b79" >> "$GITHUB_ENV"
          elif [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            if [[ ! "$MONITORING_BASIC_AUTH_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "The main-branch check requires the MONITORING_BASIC_AUTH_SHA256 repository secret." >&2
              exit 1
            fi
            if [[ ! "$MONITORING_API_KEY_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "The main-branch check requires the MONITORING_API_KEY_SHA256 repository secret." >&2
              exit 1
            fi
          fi
          npm run check
      - name: Save checked Cloud Assembly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: checked-cdk-assembly-${{ github.sha }}
          path: cdk.out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy checked assembly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download checked Cloud Assembly
        uses: actions/download-artifact@v8.0.1
        with:
          name: checked-cdk-assembly-${{ github.sha }}
          path: cdk.out
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          allowed-account-ids: '387483252302'
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
      - name: Deploy checked Cloud Assembly
        run: npm run deploy
