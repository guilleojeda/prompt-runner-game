<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 112">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dff6ff" />
      <stop offset="1" stop-color="#f7fcff" />
    </linearGradient>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#b9d9e9" />
    </linearGradient>
    <g id="robot-head">
      <path d="M50 10V4" fill="none" stroke="#15334a" stroke-linecap="round" stroke-width="4" />
      <circle cx="50" cy="4" r="4" fill="#fbba55" stroke="#15334a" stroke-width="2" />
      <rect x="25" y="10" width="50" height="40" rx="14" fill="url(#body)" stroke="#15334a" stroke-width="4" />
      <path d="M25 25H20v13h5m50-13h5v13h-5" fill="#8db6cb" stroke="#15334a" stroke-linejoin="round" stroke-width="3" />
      <rect x="31" y="19" width="38" height="23" rx="9" fill="#163953" />
      <ellipse cx="42" cy="29" rx="3.3" ry="4.2" fill="#77e1df" />
      <ellipse cx="58" cy="29" rx="3.3" ry="4.2" fill="#77e1df" />
      <path d="M44 36q6 4 12 0" fill="none" stroke="#77e1df" stroke-linecap="round" stroke-width="2" />
      <path d="M31 14q19-9 38 0" fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".85" stroke-width="2" />
    </g>
    <g id="robot-torso">
      <rect x="33" y="49" width="34" height="34" rx="11" fill="url(#body)" stroke="#15334a" stroke-width="4" />
      <path d="M41 55h18" stroke="#fff" stroke-linecap="round" stroke-width="3" />
      <circle cx="50" cy="68" r="4" fill="#fbba55" stroke="#15334a" stroke-width="2" />
      <path d="M39 78h22" stroke="#8db6cb" stroke-linecap="round" stroke-width="3" />
    </g>
    <g id="robot-arm">
      <path d="M0 3q-8 10 0 20" fill="none" stroke="#15334a" stroke-linecap="round" stroke-width="8" />
      <path d="M0 3q-8 10 0 20" fill="none" stroke="#bddcea" stroke-linecap="round" stroke-width="4" />
      <circle cy="25" r="5" fill="#fbba55" stroke="#15334a" stroke-width="2.5" />
    </g>
    <g id="robot-leg">
      <path d="M0 0v18" fill="none" stroke="#15334a" stroke-linecap="round" stroke-width="9" />
      <path d="M0 0v17" fill="none" stroke="#91bed2" stroke-linecap="round" stroke-width="5" />
      <path d="M-1 17h14q5 0 5 4t-5 4H-3" fill="#f7fbff" stroke="#15334a" stroke-linejoin="round" stroke-width="3" />
    </g>
    <g id="robot-standing">
      <use href="#robot-head" />
      <use href="#robot-torso" />
      <use href="#robot-arm" transform="translate(34 55) rotate(18)" />
      <use href="#robot-arm" transform="translate(66 55) scale(-1 1) rotate(18)" />
      <use href="#robot-leg" transform="translate(42 81)" />
      <use href="#robot-leg" transform="translate(58 81)" />
    </g>
  </defs>

  <symbol id="robot-idle" viewBox="0 0 100 112">
    <use href="#robot-standing" />
  </symbol>
  <symbol id="robot-step-a" viewBox="0 0 100 112">
    <use href="#robot-head" transform="translate(0 -1)" />
    <use href="#robot-torso" />
    <use href="#robot-arm" transform="translate(34 56) rotate(-36)" />
    <use href="#robot-arm" transform="translate(66 56) scale(-1 1) rotate(-36)" />
    <use href="#robot-leg" transform="translate(42 81) rotate(-31)" />
    <use href="#robot-leg" transform="translate(58 81) rotate(30)" />
  </symbol>
  <symbol id="robot-step-b" viewBox="0 0 100 112">
    <use href="#robot-head" transform="translate(0 -1)" />
    <use href="#robot-torso" />
    <use href="#robot-arm" transform="translate(34 56) rotate(34)" />
    <use href="#robot-arm" transform="translate(66 56) scale(-1 1) rotate(34)" />
    <use href="#robot-leg" transform="translate(42 81) rotate(30)" />
    <use href="#robot-leg" transform="translate(58 81) rotate(-31)" />
  </symbol>
  <symbol id="robot-jump" viewBox="0 0 100 112">
    <use href="#robot-head" transform="translate(0 -5)" />
    <use href="#robot-torso" transform="translate(0 -3) rotate(-5 50 66)" />
    <use href="#robot-arm" transform="translate(35 53) rotate(-112)" />
    <use href="#robot-arm" transform="translate(65 53) scale(-1 1) rotate(-112)" />
    <use href="#robot-leg" transform="translate(43 76) rotate(-52)" />
    <use href="#robot-leg" transform="translate(57 76) rotate(52)" />
  </symbol>
  <symbol id="robot-crouch" viewBox="0 0 100 112">
    <use href="#robot-head" transform="translate(0 23) scale(1 .78)" />
    <use href="#robot-torso" transform="translate(0 20) scale(1 .76)" />
    <use href="#robot-arm" transform="translate(36 68) rotate(60)" />
    <use href="#robot-arm" transform="translate(64 68) scale(-1 1) rotate(60)" />
    <use href="#robot-leg" transform="translate(42 82) rotate(-33)" />
    <use href="#robot-leg" transform="translate(58 82) rotate(33)" />
  </symbol>
  <symbol id="robot-fall" viewBox="0 0 100 112">
    <g transform="rotate(11 50 108)">
      <use href="#robot-head" transform="translate(0 -1)" />
      <use href="#robot-torso" />
      <use href="#robot-arm" transform="translate(34 55) rotate(-105)" />
      <use href="#robot-arm" transform="translate(66 55) scale(-1 1) rotate(-105)" />
      <use href="#robot-leg" transform="translate(42 81) rotate(-35)" />
      <use href="#robot-leg" transform="translate(58 81) rotate(35)" />
    </g>
    <path d="M12 52q-8 5-9 13m12-1q-8 5-9 13" fill="none" stroke="#77e1df" stroke-linecap="round" stroke-width="3" />
  </symbol>
  <symbol id="robot-impact" viewBox="0 0 100 112">
    <g transform="translate(0 3) rotate(-12 50 108)">
      <use href="#robot-standing" />
    </g>
    <path d="m21 32-7-7m72 7 7-7M17 52H7m86 0H83" fill="none" stroke="#ef8862" stroke-linecap="round" stroke-width="4" />
  </symbol>
  <symbol id="robot-celebrate" viewBox="0 0 100 112">
    <use href="#robot-head" transform="translate(0 -1)" />
    <use href="#robot-torso" />
    <use href="#robot-arm" transform="translate(35 55) rotate(-116)" />
    <use href="#robot-arm" transform="translate(65 55) scale(-1 1) rotate(-116)" />
    <use href="#robot-leg" transform="translate(42 81) rotate(-12)" />
    <use href="#robot-leg" transform="translate(58 81) rotate(12)" />
    <path d="M39 23q3-3 6 0m10 0q3-3 6 0" fill="none" stroke="#77e1df" stroke-linecap="round" stroke-width="2" />
  </symbol>

  <symbol id="terrain-ground" viewBox="0 0 120 70" preserveAspectRatio="none">
    <path d="M0 14H120V70H0z" fill="#6eaa80" />
    <path d="M0 14H120" stroke="#2b735b" stroke-linecap="round" stroke-width="8" />
    <path d="M0 28h120" stroke="#8bc18e" stroke-width="3" />
    <path d="M14 40h23m15 13h17m15-14h23" stroke="#588b70" stroke-linecap="round" stroke-width="3" opacity=".8" />
  </symbol>
  <symbol id="terrain-platform-ground" viewBox="0 0 120 70" preserveAspectRatio="none">
    <path d="M0 14H120V70H0z" fill="#5a9ca1" />
    <path d="M0 14H120" stroke="#245c67" stroke-linecap="round" stroke-width="8" />
    <rect x="9" y="26" width="102" height="11" rx="4" fill="#a6e0d2" stroke="#245c67" stroke-width="3" />
    <path d="M19 28v7m82-7v7" stroke="#f6d079" stroke-linecap="round" stroke-width="3" />
    <path d="M15 50h25m15 0h25m15 0h10" stroke="#78b8b1" stroke-linecap="round" stroke-width="3" opacity=".9" />
  </symbol>
  <symbol id="terrain-platform-frame" viewBox="0 0 120 100" preserveAspectRatio="none">
    <path d="M12 5v79m96-79v79" fill="none" stroke="#245c67" stroke-linecap="round" stroke-width="8" />
    <path d="M12 13h96M12 22h96" fill="none" stroke="#5a9ca1" stroke-linecap="round" stroke-width="3" stroke-dasharray="5 8" />
    <path d="M0 18h24m72 0h24" stroke="#f6d079" stroke-linecap="round" stroke-width="5" />
    <circle cx="12" cy="9" r="7" fill="#a6e0d2" stroke="#245c67" stroke-width="3" />
    <circle cx="108" cy="9" r="7" fill="#a6e0d2" stroke="#245c67" stroke-width="3" />
    <path d="M24 57h72" stroke="#78b8b1" stroke-linecap="round" stroke-width="4" stroke-dasharray="5 7" opacity=".9" />
  </symbol>
  <symbol id="terrain-barrier-low" viewBox="0 0 120 100" preserveAspectRatio="none">
    <path d="M21 59h78v37H21z" fill="#dc8060" stroke="#773f38" stroke-linejoin="round" stroke-width="5" />
    <path d="M23 67h74M23 82h74" stroke="#f7b16a" stroke-linecap="round" stroke-width="5" />
    <path d="m31 58 13-18 13 18m6 0 13-18 13 18" fill="#efaa65" stroke="#773f38" stroke-linejoin="round" stroke-width="4" />
  </symbol>
  <symbol id="terrain-barrier-high" viewBox="0 0 120 100" preserveAspectRatio="none">
    <path d="M21 18h78v78H21z" fill="#bd6258" stroke="#693b42" stroke-linejoin="round" stroke-width="5" />
    <path d="M23 29h74M23 45h74M23 61h74M23 77h74" stroke="#e99a61" stroke-linecap="round" stroke-width="5" />
    <path d="M35 19V7h50v12" fill="none" stroke="#693b42" stroke-linejoin="round" stroke-width="5" />
  </symbol>
  <symbol id="terrain-pit-edge" viewBox="0 0 24 70" preserveAspectRatio="none">
    <path d="M0 14h24v8H0z" fill="#6eaa80" />
    <path d="M0 14h24" stroke="#2b735b" stroke-linecap="round" stroke-width="8" />
    <path d="M0 22 9 70h15V22z" fill="#d2edf5" opacity=".58" />
    <path d="M0 24 12 70" stroke="#9ccbd8" stroke-width="2" opacity=".65" />
  </symbol>
  <symbol id="terrain-branch-back" viewBox="0 0 120 90" preserveAspectRatio="none">
    <path d="M7 44Q60 14 113 44L108 59H12z" fill="#b47b4a" stroke="#694730" stroke-linejoin="round" stroke-width="4" />
    <path d="M17 45q40-19 86 0" fill="none" stroke="#dca66b" stroke-linecap="round" stroke-width="5" />
    <path d="M39 35q-17-21-27-10 3 17 27 17m36-7q15-22 27-9-3 18-27 17" fill="#69a77d" stroke="#396e59" stroke-linejoin="round" stroke-width="3" />
  </symbol>
  <symbol id="terrain-branch-front" viewBox="0 0 120 44" preserveAspectRatio="none">
    <path d="M16 15Q60-1 104 15l-4 17H20z" fill="#d29a60" stroke="#694730" stroke-linejoin="round" stroke-width="3" />
    <path d="M30 15q30-10 60 0" fill="none" stroke="#f0c17f" stroke-linecap="round" stroke-width="3" />
  </symbol>
  <symbol id="terrain-exit" viewBox="0 0 70 94">
    <path d="M11 90V39a24 24 0 0 1 48 0v51" fill="#fff7df" stroke="#15334a" stroke-linejoin="round" stroke-width="6" />
    <path d="M23 90V41a12 12 0 0 1 24 0v49" fill="#90d5c8" />
    <circle cx="40" cy="62" r="3" fill="#15334a" />
    <path d="M8 91h54" stroke="#15334a" stroke-linecap="round" stroke-width="6" />
  </symbol>
  <symbol id="effect-impact" viewBox="0 0 100 100">
    <path d="m50 3 9 25 23-14-8 26 25 2-21 16 19 18-27-3-4 26-16-20-17 20-3-27-27 3 19-19L1 39l27-1-8-26 23 15z" fill="#ffbe5c" stroke="#ef8862" stroke-linejoin="round" stroke-width="4" />
    <circle cx="50" cy="51" r="15" fill="#fff4d5" />
  </symbol>
  <symbol id="effect-victory" viewBox="0 0 100 100">
    <path d="M12 19v10m-5-5h10M79 11v12m-6-6h12M84 66v10m-5-5h10M22 75v12m-6-6h12" stroke="#ef8862" stroke-linecap="round" stroke-width="4" />
    <path d="m49 9 4 12 12-4-7 11 10 8-13 1-3 13-7-11-11 7 4-13-11-6 13-2z" fill="#fbba55" />
    <circle cx="48" cy="54" r="17" fill="#77e1df" opacity=".8" />
  </symbol>
</svg>
