name: Checks and deploy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-and-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Verify build and infrastructure
    runs-on: ubuntu-24.04
    env:
      BUILD_REVISION: ${{ github.sha }}
      VITE_BUILD_REVISION: ${{ github.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run repository checks
        run: npm run check
      - name: Save checked Cloud Assembly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: checked-cdk-assembly-${{ github.sha }}
          path: cdk.out
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy checked assembly
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Download checked Cloud Assembly
        uses: actions/download-artifact@v8.0.1
        with:
          name: checked-cdk-assembly-${{ github.sha }}
          path: cdk.out
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          allowed-account-ids: '387483252302'
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-${{ github.run_id }}
      - name: Deploy checked Cloud Assembly
        run: npm run deploy
